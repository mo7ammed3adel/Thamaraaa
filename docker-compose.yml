# Thamaraa CRM — runs alongside the existing hermes stack on this host.
#
# The container joins hermes' network so the Caddy container (hermes_dashboard,
# which owns 80/443) can reach it as http://thamaraa-crm:3000 and terminate TLS
# for it. The published port is bound to 127.0.0.1 so the app is never served
# over plain HTTP from the outside — cookies here are Secure-only in production.
services:
  thamaraa-crm:
    build:
      context: .
      dockerfile: Dockerfile
    image: thamaraa-crm:latest
    container_name: thamaraa-crm
    restart: unless-stopped
    # A tiny init (tini) as PID 1 reaps finished child processes — every
    # healthcheck run leaves one behind, and without a reaper they pile up as
    # zombies on the host.
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    # One file feeds both the container's runtime env and compose's own ${...}
    # interpolation — compose only reads ".env" for the latter, so splitting the
    # two would mean keeping the database password in two places.
    env_file:
      - .env
    environment:
      SCREENSHOT_STORAGE_DIR: /data/screenshots
      CHAT_STORAGE_DIR: /data/chat
    volumes:
      - screenshots:/data/screenshots
      - chat_files:/data/chat
    healthcheck:
      # /login is public, so a healthy response proves the app booted and can
      # render, without needing a session.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      # Generous: on this host the CPU is heavily contended, and a 5s timeout
      # marked a perfectly fine app unhealthy.
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        # Started, not healthy: Docker once could not even launch the db
        # healthcheck in time, which kept the app down although postgres was
        # up. Prisma connects on first query and retries on its own.
        condition: service_started
    networks:
      - default
      - hermes

  # ---------- Realtime (Soketi) ----------------------------------------------
  # A self-hosted Pusher-protocol server, so chat and notifications arrive the
  # moment they're sent instead of on the next poll. The app calls it at
  # http://thamaraa-soketi:6001 (PUSHER_HOST/PORT); browsers reach it through
  # Caddy at wss://<host>/realtime (PUSHER_PUBLIC_*). Without these keys in
  # .env it idles harmlessly and the app keeps polling.
  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: thamaraa-soketi
    restart: unless-stopped
    init: true
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-disabled}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_KEY:-disabled}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_SECRET:-disabled}
      # Browsers may only listen; every event comes from the app server.
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"
    # It holds a few hundred idle sockets at most; keep it from ever competing
    # with the app on this crowded host.
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - hermes

  # ---------- Calls (LiveKit) -----------------------------------------------
  # Self-hosted WebRTC server for voice/video calls and screen share. Signaling
  # goes through Caddy (wss://<host>/livekit, stripped to :7880 here); media
  # uses its own ports straight to this host: UDP 7882 (one muxed port) and
  # TCP 7881 as the fallback for networks that block UDP. Both must be open in
  # the firewall. The app talks to it at http://thamaraa-livekit:7880, and it
  # reports room events back to the app's /api/livekit/webhook.
  # Without LIVEKIT_* in .env the call buttons stay hidden.
  # Only runs with the "calls" profile (COMPOSE_PROFILES=calls in .env), so it
  # can never come up on the placeholder keys below.
  livekit:
    profiles: ["calls"]
    image: livekit/livekit-server:v1.13.11
    container_name: thamaraa-livekit
    restart: unless-stopped
    init: true
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: warn
        rtc:
          tcp_port: 7881
          udp_port: 7882
          # The public address browsers send media to.
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
          use_external_ip: false
        keys:
          ${LIVEKIT_API_KEY:-disabled}: ${LIVEKIT_API_SECRET:-disabled-disabled-disabled-disabled}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-disabled}
          urls:
            - http://thamaraa-crm:3000/api/livekit/webhook
        room:
          # An empty room (and so its call) closes quickly.
          empty_timeout: 60
          departure_timeout: 15
          max_participants: 50
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - hermes

  # ---------- PostgreSQL ----------------------------------------------------
  # The CRM's own database, separate from the hermes stack's postgres so the
  # two can be backed up, upgraded and broken independently. Never published to
  # the host: only the app container reaches it, over the private network.
  db:
    # Matches the Postgres major version the data was dumped from, so a restore
    # never has to go from a newer server to an older one.
    image: postgres:17-alpine
    container_name: thamaraa-db
    restart: unless-stopped
    # A tiny init (tini) as PID 1 reaps finished child processes — every
    # healthcheck run leaves one behind, and without a reaper they pile up as
    # zombies on the host.
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thamaraa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-thamaraa}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thamaraa} -d ${POSTGRES_DB:-thamaraa}"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

volumes:
  db_data:
  screenshots:
  chat_files:

networks:
  # Created by the hermes stack; referenced, never managed, from here.
  hermes:
    name: hermes_hermes
    external: true
