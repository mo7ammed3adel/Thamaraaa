# Thamaraa CRM — runs alongside the existing hermes stack on this host.
#
# The container joins hermes' network so the Caddy container (hermes_dashboard,
# which owns 80/443) can reach it as http://thamaraa-crm:3000 and terminate TLS
# for it. The published port is bound to 127.0.0.1 so the app is never served
# over plain HTTP from the outside — cookies here are Secure-only in production.
services:
  thamaraa-crm:
    build:
      context: .
      dockerfile: Dockerfile
    image: thamaraa-crm:latest
    container_name: thamaraa-crm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    # One file feeds both the container's runtime env and compose's own ${...}
    # interpolation — compose only reads ".env" for the latter, so splitting the
    # two would mean keeping the database password in two places.
    env_file:
      - .env
    healthcheck:
      # /login is public, so a healthy response proves the app booted and can
      # render, without needing a session.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - hermes

  # ---------- PostgreSQL ----------------------------------------------------
  # The CRM's own database, separate from the hermes stack's postgres so the
  # two can be backed up, upgraded and broken independently. Never published to
  # the host: only the app container reaches it, over the private network.
  db:
    image: postgres:16-alpine
    container_name: thamaraa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thamaraa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-thamaraa}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thamaraa} -d ${POSTGRES_DB:-thamaraa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

volumes:
  db_data:

networks:
  # Created by the hermes stack; referenced, never managed, from here.
  hermes:
    name: hermes_hermes
    external: true
